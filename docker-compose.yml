version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: maarif_keuangan_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: maarif_keuangan
      POSTGRES_USER: maarif
      POSTGRES_PASSWORD: maarif_secret_2026
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maarif -d maarif_keuangan"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: maarif_keuangan_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@maarif.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
